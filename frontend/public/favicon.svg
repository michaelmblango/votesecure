<svg xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 32 32"
               width="32" height="32">
    <!-- Background -->
    <rect width="32" height="32" rx="7" fill="#0D2B55"/>

    <!-- Ballot slot paper top -->
    <rect x="14" y="7" width="5" height="6"
          rx="1" fill="#ffffff" opacity="0.95"/>

    <!-- Green checkmark on paper -->
    <polyline
      points="15.1,10.120000000000001
              16.25,11.56
              17.9,8.44"
      stroke="#22C55E" stroke-width="1"
      stroke-linecap="round" stroke-linejoin="round"
      fill="none"/>

    <!-- Ballot box body -->
    <rect x="8" y="13" width="17" height="14"
          rx="2"
          fill="#ffffff" opacity="0.18"/>

    <!-- Slot at top of box -->
    <rect x="12" y="12"
          width="8" height="2"
          rx="1"
          fill="#0D2B55" opacity="0.6"/>

    <!-- Two handle dots -->
    <circle cx="12" cy="19"
            r="1" fill="#ffffff" opacity="0.4"/>
    <circle cx="20" cy="19"
            r="1" fill="#ffffff" opacity="0.4"/>
  </svg>